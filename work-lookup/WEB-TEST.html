<!doctype html><html lang="ko"><meta charset="utf-8"><title>네이티브 단축키 조회 테스트</title><style>body{font:18px system-ui;max-width:800px;margin:50px auto;line-height:1.8}code{display:block;background:#eef4f5;padding:15px}</style><h1>텍스트 선택 → F8 → 조회</h1><p>Run.cmd를 실행하고 아래 글자를 선택한 뒤 설정한 단축키를 눌렀다가 손을 떼세요.</p><code>AAAA_BBBB_CCCCC_001</code><code>corebank-dev-01</code><p>결과 글자를 선택하고 Ctrl+C로 복사합니다. Esc나 바깥 클릭으로 닫힙니다.</p></html>
